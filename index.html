<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mensajes</title>
</head>
<body>

<h2>Escribí un mensaje</h2>

<input type="text" id="mensaje">
<button onclick="enviarMensaje()">Enviar</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  push
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyAMEYd-JxrQMdsDHYTKSBzhyUg65jLJfLA",
  authDomain: "visuales-66bce.firebaseapp.com",
  databaseURL: "https://visuales-66bce-default-rtdb.firebaseio.com",
  projectId: "visuales-66bce",
  storageBucket: "visuales-66bce.firebasestorage.app",
  messagingSenderId: "1075734290553",
  appId: "1:1075734290553:web:924cc39197b00bcad534a8",
  measurementId: "G-ZKXVXRHVXK"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

window.enviarMensaje = function() {

  let texto = document.getElementById("mensaje").value;

  if (texto.trim() === "") {
    return;
  }

  push(
    ref(database, "mensajes"),
    {
      texto: texto,
      fecha: Date.now()
    }
  );

  document.getElementById("mensaje").value = "";

  alert("Mensaje enviado");
}

</script>

</body>
</html>
