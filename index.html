<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enviar Mensaje</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;

    background:linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #0f172a
    );
}

.contenedor{

    width:90%;
    max-width:600px;

    padding:35px;

    border-radius:25px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,0.15);

    box-shadow:
    0 15px 50px rgba(0,0,0,.4);

    color:white;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

p{
    text-align:center;
    opacity:.8;
    margin-bottom:25px;
}

textarea{

    width:100%;
    height:180px;

    resize:none;

    border:none;

    border-radius:15px;

    padding:20px;

    font-size:20px;

    background:rgba(255,255,255,0.1);

    color:white;

    outline:none;
}

textarea::placeholder{
    color:rgba(255,255,255,0.5);
}

button{

    width:100%;

    margin-top:20px;

    padding:18px;

    border:none;

    border-radius:15px;

    font-size:20px;

    cursor:pointer;

    background:#8b5cf6;

    color:white;

    transition:.2s;
}

button:hover{

    transform:scale(1.02);

    background:#7c3aed;
}

</style>
</head>
<body>

<div class="contenedor">

    <h1>✦ Dejá tu mensaje ✦</h1>

    <p>Tu texto aparecerá en la instalación.</p>

    <textarea
        id="mensaje"
        placeholder="Escribí algo..."
    ></textarea>

    <button onclick="enviarMensaje()">
        Enviar
    </button>

</div>

<script>

function enviarMensaje(){

    let mensaje =
    document.getElementById("mensaje").value;

    if(mensaje.trim()==""){

        alert("Escribí un mensaje");

        return;
    }

    alert("Mensaje enviado");

    document.getElementById("mensaje").value="";
}

</script>

</body>
</html>
